<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      Ashirvachana | Book Pandit for Online & Offline Pooja Services

      name="description"
      content="Ashirvachana is a trusted platform to book experienced pandits for online and offline pooja services across India. Book Satyanarayan Pooja, Griha Pravesh, Rudrabhishek, and more."

    <meta name="author" content="Ashirvachana" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->

      property="og:title"
      content="Ashirvachana | Book Pandit for Online & Offline Pooja Services"
    />

    <meta
      property="og:description"
      content="Book trusted pandits for all Hindu rituals and poojas. Ashirvachana provides convenient online and offline pooja services across India."

    <!-- Replace with your website banner/logo -->

      property="og:image"
      content="https://www.ashirvachana.com/og-image.jpg"
    />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Ashirvachana | Book Pandit for Online & Offline Pooja Services"
    />

      name="twitter:description"
